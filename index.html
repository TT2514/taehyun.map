<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TEAHYUN MAP</title>
    <style>
        /* 引入你的专属字体 */
        @font-face {
            font-family: 'YouthRegular';
            src: url('YouthRegular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111;
            height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
            
            /* 铺满屏幕的动态背景图设置 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        /* 背景图上的柔和通透遮罩，让白色网格和粉框更有层次感 */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.12); 
            z-index: -1;
        }

        /* 背景线条网格 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 100% 32px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 粉色核心区域：按照你的最新可视化调整尺寸 */
        .hero-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 722px;
            height: 280px;
            background-color: #ffb3cf;
            border: 1px solid #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        /* 主标题：独立控制大小与位置 */
        .hero-container h1 {
            font-family: 'YouthRegular', "Times New Roman", Times, serif;
            font-weight: normal;
            line-height: 0.72; 
            letter-spacing: -5px; 
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-4px, 16px);
        }

        /* 第一行：TAEHYUN */
        .line-1 {
            display: flex;
            align-items: flex-end;
        }
        .line-1 .t1 { font-size: 155px; }
        .line-1 .a1 { font-size: 120px; }
        .line-1 .e  { font-size: 135px; }
        .line-1 .h  { font-size: 145px; }
        .line-1 .y  { font-size: 125px; }
        .line-1 .u  { font-size: 140px; }
        .line-1 .n  { font-size: 130px; }

        /* 第二行：MAP */
        .line-2 {
            display: flex;
            align-items: flex-start;
            margin-top: -18px; 
        }
        .line-2 .m { font-size: 150px; }
        .line-2 .a2{ font-size: 125px; }
        .line-2 .p { font-size: 140px; }

        /* KOREA 按钮：按最新偏移量定位 */
        .btn-korea {
            display: inline-block;
            padding: 9px 30px;
            background: #ffffff;
            color: #111;
            border: 1px solid #111;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            font-weight: 500;
            transition: all 0.2s ease;
            transform: translate(-12px, -15px);
        }
        .btn-korea:hover {
            background: #111;
            color: #fff;
        }

        /* 左下角署名 */
        .footer-note {
            position: absolute;
            bottom: 25px;
            left: 40px;
            font-size: 12px;
            color: #111;
            letter-spacing: 0.5px;
            transform: translate(-17px, 16px);
            z-index: 2;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 中间横长方形粉色区域 -->
    <div class="hero-container">
        <h1>
            <div class="line-1">
                <span class="t1">T</span><span class="a1">A</span><span class="e">E</span><span class="h">H</span><span class="y">Y</span><span class="u">U</span><span class="n">N</span>
            </div>
            <div class="line-2">
                <span class="m">M</span><span class="a2">A</span><span class="p">P</span>
            </div>
        </h1>
        <a href="korea.html" class="btn-korea">KOREA</a>
    </div>

    <!-- 左下角署名 -->
    <div class="footer-note">Made by TT</div>

    <script>
        // 自动检测本地时间切换背景图（调用单数 image 文件夹内的图片）
        const currentHour = new Date().getHours();
        const isDayTime = currentHour >= 6 && currentHour < 18;
        
        const bgImageUrl = isDayTime ? 'image/bg-day.jpg' : 'image/bg-night.jpg';
        document.body.style.backgroundImage = `url('${bgImageUrl}')`;
    </script>

</body>
</html>
