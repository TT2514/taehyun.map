<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TEAHYUN MAP</title>
    <style>
        /* 引入你的专属字体 */
        @font-face {
            font-family: 'YouthRegular';
            src: url('YouthRegular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111;
            height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
            
            /* 动态背景图基础设置：铺满屏幕、居中显示 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        /* 背景图上的柔和遮罩，保证文字和粉色框超级显眼 */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.15); /* 极淡的通透遮罩 */
            z-index: -1;
        }

        /* 背景线条网格 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 100% 32px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
        }

        /* 长方形粉色核心区域 */
        .hero-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1020px;
            height: 440px;
            background-color: #ffb3cf;
            border: 1px solid #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 2;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); /* 增加一点轻微立体阴影，让卡片在背景上跳出来 */
        }

        /* 标题整体放大 */
        .hero-container h1 {
            font-family: 'YouthRegular', "Times New Roman", Times, serif;
            font-weight: normal;
            line-height: 0.68; 
            letter-spacing: -8px; 
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(4px, 5px);
        }

        /* 第一行：TAEHYUN */
        .line-1 {
            display: flex;
            align-items: flex-end;
        }
        .line-1 .t1 { font-size: 210px; }
        .line-1 .a1 { font-size: 160px; }
        .line-1 .e  { font-size: 180px; }
        .line-1 .h  { font-size: 195px; }
        .line-1 .y  { font-size: 165px; }
        .line-1 .u  { font-size: 190px; }
        .line-1 .n  { font-size: 175px; }

        /* 第二行：MAP */
        .line-2 {
            display: flex;
            align-items: flex-start;
            margin-top: -26px; 
        }
        .line-2 .m { font-size: 200px; }
        .line-2 .a2{ font-size: 165px; }
        .line-2 .p { font-size: 185px; }

        /* KOREA 按钮 */
        .btn-korea {
            display: inline-block;
            padding: 10px 34px;
            background: #ffffff;
            color: #111;
            border: 1px solid #111;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-korea:hover {
            background: #111;
            color: #fff;
        }

        /* 左下角署名 */
        .footer-note {
            position: absolute;
            bottom: 25px;
            left: 40px;
            font-size: 12px;
            color: #111;
            letter-spacing: 0.5px;
            transform: translate(-17px, 16px);
            z-index: 2;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 中间横长方形粉色区域 -->
    <div class="hero-container">
        <h1>
            <div class="line-1">
                <span class="t1">T</span><span class="a1">A</span><span class="e">E</span><span class="h">H</span><span class="y">Y</span><span class="u">U</span><span class="n">N</span>
            </div>
            <div class="line-2">
                <span class="m">M</span><span class="a2">A</span><span class="p">P</span>
            </div>
        </h1>
        <a href="korea.html" class="btn-korea">KOREA</a>
    </div>

    <!-- 左下角署名 -->
    <div class="footer-note">Made by TT</div>

    <script>
        // 根据本地时间自动切换白天/夜晚背景图
        const currentHour = new Date().getHours();
        // 6:00 到 18:00 判定为白天，其余为夜晚
        const isDayTime = currentHour >= 6 && currentHour < 18;
        
        const bgImageUrl = isDayTime ? 'images/bg-day.jpg' : 'images/bg-night.jpg';
        document.body.style.backgroundImage = `url('${bgImageUrl}')`;
    </script>

</body>
</html>
