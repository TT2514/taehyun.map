<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TEAHYUN MAP</title>
    <style>
        /* 引入你的专属字体 */
        @font-face {
            font-family: 'YouthRegular';
            src: url('YouthRegular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111;
            height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* 背景线条网格 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(#eee 1px, transparent 1px);
            background-size: 100% 32px;
            z-index: -1;
            opacity: 0.6;
        }

        /* 长方形粉色核心区域 */
        .hero-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 893px;
            height: 383px;
            background-color: #ffb3cf;
            border: 1px solid #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        /* 标题整体放大、极度紧凑 */
        .hero-container h1 {
            font-family: 'YouthRegular', "Times New Roman", Times, serif;
            font-weight: normal;
            line-height: 0.7; 
            letter-spacing: -6px; /* 进一步收紧字间距 */
            margin-bottom: 22px; /* 调整与下方按钮的距离 */
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(3px, 5px);
        }

        /* 第一行：TAEHYUN (放大字号) */
        .line-1 {
            display: flex;
            align-items: flex-end;
        }
        .line-1 .t1 { font-size: 175px; }
        .line-1 .a1 { font-size: 135px; }
        .line-1 .e  { font-size: 150px; }
        .line-1 .h  { font-size: 165px; }
        .line-1 .y  { font-size: 140px; }
        .line-1 .u  { font-size: 160px; }
        .line-1 .n  { font-size: 145px; }

        /* 第二行：MAP (放大字号，并通过负边距和第一行紧紧咬合) */
        .line-2 {
            display: flex;
            align-items: flex-start;
            margin-top: -22px; 
        }
        .line-2 .m { font-size: 170px; }
        .line-2 .a2{ font-size: 140px; }
        .line-2 .p { font-size: 155px; }

        /* KOREA 按钮位置下移、更清爽 */
        .btn-korea {
            display: inline-block;
            padding: 9px 30px;
            background: #ffffff;
            color: #111;
            border: 1px solid #111;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-korea:hover {
            background: #111;
            color: #fff;
        }

        /* 左下角署名 */
        .footer-note {
            position: absolute;
            bottom: 25px;
            left: 40px;
            font-size: 12px;
            color: #111;
            letter-spacing: 0.5px;
            transform: translate(-17px, 16px);
        }
    </style>
</head>
<body>

    <!-- 中间横长方形粉色区域 -->
    <div class="hero-container">
        <h1>
            <div class="line-1">
                <span class="t1">T</span><span class="a1">A</span><span class="e">E</span><span class="h">H</span><span class="y">Y</span><span class="u">U</span><span class="n">N</span>
            </div>
            <div class="line-2">
                <span class="m">M</span><span class="a2">A'</span><span class="p">P</span>
            </div>
        </h1>
        <a href="korea.html" class="btn-korea">KOREA</a>
    </div>

    <!-- 左下角署名 -->
    <div class="footer-note">Made by TT</div>

</body>
</html>
