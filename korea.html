<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Korea - Taehyun Map</title>
    <!-- 引入外部样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body onclick="handleBodyClick(event)">

    <!-- 左侧地图区 -->
    <div class="map-section">
        <div class="map-placeholder-box">
            [ 韩国地图图片占位 ]<br>
            <span style="font-size: 12px; color: #999;">后续可替换为真实的韩国矢量地图</span>
        </div>
        <!-- 示例地图点 -->
        <div class="map-pin" style="top: 45%; left: 48%;" onclick="event.stopPropagation(); expandCard('card1')"></div>
        <div class="map-pin" style="top: 65%; left: 32%;" onclick="event.stopPropagation(); expandCard('card2')"></div>
    </div>

    <!-- 右侧列表区 -->
    <div class="content-section">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <h1>KOREA SPOTS</h1>
        
        <!-- 卡片 1 -->
        <div class="spot-card" id="card1" onclick="expandCard('card1')">
            <div class="card-collapsed">
                <div class="spot-thumb"></div>
                <div class="spot-info">
                    <h3>某某潮流咖啡馆</h3>
                    <p>首尔特别市江南区...</p>
                </div>
            </div>
            <div class="card-details">
                <!-- 右上角导航按钮 -->
                <a href="https://maps.google.com" target="_blank" class="map-btn-top" onclick="event.stopPropagation()">打开 Google Maps 导航 ↗</a>
                
                <!-- 文字在上 -->
                <div class="detail-text-group">
                    <p class="detail-address"><strong>详细地址：</strong>首尔特别市江南区岛山大路 123</p>
                    <p class="detail-address"><strong>打卡说明：</strong>姜太显在某次Vlog中出现过的同款咖啡馆，店内招牌拿铁很有名。</p>
                </div>

                <!-- 现场照片在下 -->
                <div class="detail-photos">
                    <div>现场照片1</div>
                    <div>同款照片2</div>
                </div>
            </div>
        </div>

        <!-- 卡片 2 -->
        <div class="spot-card" id="card2" onclick="expandCard('card2')">
            <div class="card-collapsed">
                <div class="spot-thumb"></div>
                <div class="spot-info">
                    <h3>汉江公园同款长椅</h3>
                    <p>首尔永登浦区汝矣岛洞...</p>
                </div>
            </div>
            <div class="card-details">
                <!-- 右上角导航按钮 -->
                <a href="https://maps.google.com" target="_blank" class="map-btn-top" onclick="event.stopPropagation()">打开 Google Maps 导航 ↗</a>
                
                <!-- 文字在上 -->
                <div class="detail-text-group">
                    <p class="detail-address"><strong>详细地址：</strong>首尔永登浦区汝矣东路 330</p>
                    <p class="detail-address"><strong>打卡说明：</strong>散步直拍同款取景地，傍晚去可以看到非常漂亮的汉江日落。</p>
                </div>

                <!-- 现场照片在下 -->
                <div class="detail-photos">
                    <div>现场照片1</div>
                    <div>同款照片2</div>
                </div>
            </div>
        </div>

    </div>

    <!-- 引入外部交互逻辑文件 -->
    <script src="main.js"></script>
</body>
</html>
