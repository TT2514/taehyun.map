<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Korea - Taehyun Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff;
            color: #111;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左侧地图区域 */
        .map-section {
            width: 50%;
            height: 100%;
            position: relative;
            background: #f9f9f9;
            border-right: 1px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .map-placeholder-box {
            text-align: center;
            color: #666;
            font-size: 16px;
        }
        /* 地图上的打卡实心圆点 */
        .map-pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #ff3366;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 2px #111;
            transition: transform 0.2s;
        }
        .map-pin:hover {
            transform: scale(1.4);
        }

        /* 右侧内容滚动区 */
        .content-section {
            width: 50%;
            height: 100%;
            padding: 40px;
            overflow-y: auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .back-link {
            font-size: 13px;
            text-decoration: none;
            color: #666;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-link:hover { color: #111; }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* 圆角卡片样式列表 */
        .spot-card {
            display: flex;
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #eaeaea;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .spot-card:hover {
            transform: translateY(-2px);
            border-color: #111;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        .spot-thumb {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
        }
        .spot-info {
            margin-left: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .spot-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .spot-info p {
            font-size: 13px;
            color: #666;
        }

        /* 点击卡片后弹出的详情视图（默认隐藏，点击后显示） */
        .detail-view {
            display: none;
            background: #fff;
            border: 1px solid #111;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 6px 6px 0px #111;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .close-btn {
            background: none;
            border: 1px solid #111;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .close-btn:hover { background: #111; color: #fff; }
        
        .detail-photos {
            display: flex;
            gap: 10px;
            margin: 16px 0;
            overflow-x: auto;
        }
        .detail-photos img {
            width: 140px;
            height: 140px;
            border-radius: 8px;
            object-fit: cover;
            background: #eee;
        }
        .detail-address {
            font-size: 14px;
            color: #444;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .map-btn {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
        }
        .map-btn:hover { background: #333; }
    </style>
</head>
<body>

    <!-- 左侧地图区 -->
    <div class="map-section">
        <div class="map-placeholder-box">
            [ 韩国地图图片占位 ]<br>
            <span style="font-size: 12px; color: #999;">后续可替换为真实的韩国矢量地图</span>
        </div>
        <!-- 示例地图点 -->
        <div class="map-pin" style="top: 45%; left: 48%;" onclick="showDetail('spot1')"></div>
        <div class="map-pin" style="top: 65%; left: 32%;" onclick="showDetail('spot2')"></div>
    </div>

    <!-- 右侧列表与详情区 -->
    <div class="content-section">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <!-- 列表视图 -->
        <div id="listView">
            <h1>KOREA SPOTS</h1>
            
            <!-- 卡片 1 -->
            <div class="spot-card" onclick="showDetail('spot1')">
                <div class="spot-thumb" style="background: #ddd;"></div>
                <div class="spot-info">
                    <h3>某某潮流咖啡馆</h3>
                    <p>首尔特别市江南区...</p>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="spot-card" onclick="showDetail('spot2')">
                <div class="spot-thumb" style="background: #ddd;"></div>
                <div class="spot-info">
                    <h3>汉江公园同款长椅</h3>
                    <p>首尔永登浦区汝矣岛洞...</p>
                </div>
            </div>
        </div>

        <!-- 详细信息视图 (由 JS 控制显示) -->
        <div id="detailView" class="detail-view">
            <div class="detail-header">
                <h2 id="detailTitle" style="font-size: 20px;">地点名称</h2>
                <button class="close-btn" onclick="hideDetail()">返回列表</button>
            </div>
            <div class="detail-photos">
                <div style="width:140px; height:140px; background:#ddd; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#666;">现场照片1</div>
                <div style="width:140px; height:140px; background:#ccc; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#666;">同款照片2</div>
            </div>
            <p class="detail-address" id="detailDesc">
                <strong>详细地址：</strong>首尔特别市江南区...<br>
                <strong>打卡说明：</strong>姜太显在某次Vlog或直播中出现过的同款取景地。
            </p>
            <a href="https://maps.google.com" target="_blank" class="map-btn" id="detailLink">打开 Google Maps 导航 ↗</a>
        </div>

    </div>

    <script>
        // 模拟不同地点的详细数据
        const spotData = {
            'spot1': {
                title: '某某潮流咖啡馆',
                address: '首尔特别市江南区岛山大路 123',
                desc: '姜太显在某次Vlog中出现过的同款咖啡馆，店内招牌拿铁很有名。'
            },
            'spot2': {
                title: '汉江公园同款长椅',
                address: '首尔永登浦区汝矣东路 330',
                desc: '散步直拍同款取景地，傍晚去可以看到非常漂亮的汉江日落。'
            }
        };

        function showDetail(spotId) {
            const data = spotData[spotId];
            if(data) {
                document.getElementById('detailTitle').innerText = data.title;
                document.getElementById('detailDesc').innerHTML = `<strong>详细地址：</strong>${data.address}<br><br><strong>打卡说明：</strong>${data.desc}`;
            }
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
        }

        function hideDetail() {
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
        }
    </script>

</body>
</html>
