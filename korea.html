<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Korea - Taehyun Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff;
            color: #111;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左侧地图区域 */
        .map-section {
            width: 50%;
            height: 100%;
            position: relative;
            background: #f9f9f9;
            border-right: 1px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .map-placeholder-box {
            text-align: center;
            color: #666;
            font-size: 16px;
        }
        /* 地图上的打卡实心圆点 */
        .map-pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #ff3366;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 2px #111;
            transition: transform 0.2s;
        }
        .map-pin:hover {
            transform: scale(1.4);
        }

        /* 右侧内容滚动区 */
        .content-section {
            width: 50%;
            height: 100%;
            padding: 40px;
            overflow-y: auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .back-link {
            font-size: 13px;
            text-decoration: none;
            color: #666;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-link:hover { color: #111; }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* 卡片基础样式：默认长条形，细黑边框，无粗硬阴影 */
        .spot-card {
            background: #fff;
            border: 1px solid #111;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            /* 丝滑过渡属性 */
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 未展开时的简略布局 */
        .card-collapsed {
            display: flex;
            align-items: center;
        }
        .spot-thumb {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
            transition: all 0.35s ease;
        }
        .spot-info {
            margin-left: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .spot-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .spot-info p {
            font-size: 13px;
            color: #666;
        }

        /* 详细内容区域（默认隐藏并收起） */
        .card-details {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
        }

        /* === 展开后的状态类 (.active) === */
        .spot-card.active {
            padding: 24px; /* 展开后变大宽敞 */
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); /* 极其轻微干净的层级感 */
        }
        .spot-card.active .card-collapsed {
            margin-bottom: 16px; /* 展开后标题和图片区与下方拉开距离 */
        }
        .spot-card.active .spot-thumb {
            width: 120px; /* 展开后图片也可以微微变大呼吸 */
            height: 120px;
        }
        .spot-card.active .card-details {
            max-height: 400px; /* 预留足够的展开高度 */
            opacity: 1;
        }

        /* 展开后的内部细节样式 */
        .detail-photos {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        .detail-photos div {
            width: 140px;
            height: 140px;
            border-radius: 8px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
        }
        .detail-address {
            font-size: 14px;
            color: #444;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .map-btn {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
        }
        .map-btn:hover { background: #333; }
    </style>
</head>
<body onclick="handleBodyClick(event)">

    <!-- 左侧地图区 -->
    <div class="map-section">
        <div class="map-placeholder-box">
            [ 韩国地图图片占位 ]<br>
            <span style="font-size: 12px; color: #999;">后续可替换为真实的韩国矢量地图</span>
        </div>
        <!-- 示例地图点 -->
        <div class="map-pin" style="top: 45%; left: 48%;" onclick="event.stopPropagation(); expandCard('card1')"></div>
        <div class="map-pin" style="top: 65%; left: 32%;" onclick="event.stopPropagation(); expandCard('card2')"></div>
    </div>

    <!-- 右侧列表区 -->
    <div class="content-section">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <h1>KOREA SPOTS</h1>
        
        <!-- 卡片 1 -->
        <div class="spot-card" id="card1" onclick="expandCard('card1')">
            <div class="card-collapsed">
                <div class="spot-thumb"></div>
                <div class="spot-info">
                    <h3>某某潮流咖啡馆</h3>
                    <p>首尔特别市江南区...</p>
                </div>
            </div>
            <div class="card-details">
                <div class="detail-photos">
                    <div>现场照片1</div>
                    <div>同款照片2</div>
                </div>
                <p class="detail-address">
                    <strong>详细地址：</strong>首尔特别市江南区岛山大路 123<br><br>
                    <strong>打卡说明：</strong>姜太显在某次Vlog中出现过的同款咖啡馆，店内招牌拿铁很有名。
                </p>
                <a href="https://maps.google.com" target="_blank" class="map-btn" onclick="event.stopPropagation()">打开 Google Maps 导航 ↗</a>
            </div>
        </div>

        <!-- 卡片 2 -->
        <div class="spot-card" id="card2" onclick="expandCard('card2')">
            <div class="card-collapsed">
                <div class="spot-thumb"></div>
                <div class="spot-info">
                    <h3>汉江公园同款长椅</h3>
                    <p>首尔永登浦区汝矣岛洞...</p>
                </div>
            </div>
            <div class="card-details">
                <div class="detail-photos">
                    <div>现场照片1</div>
                    <div>同款照片2</div>
                </div>
                <p class="detail-address">
                    <strong>详细地址：</strong>首尔永登浦区汝矣东路 330<br><br>
                    <strong>打卡说明：</strong>散步直拍同款取景地，傍晚去可以看到非常漂亮的汉江日落。
                </p>
                <a href="https://maps.google.com" target="_blank" class="map-btn" onclick="event.stopPropagation()">打开 Google Maps 导航 ↗</a>
            </div>
        </div>

    </div>

    <script>
        // 点击特定卡片时，切换展开状态；如果点别的卡片，则让其它卡片先收起
        function expandCard(cardId) {
            event.stopPropagation(); // 阻止冒泡到背景
            const selectedCard = document.getElementById(cardId);
            
            // 检查当前卡片是不是已经展开了
            const isActive = selectedCard.classList.contains('active');

            // 先收起页面上所有的卡片
            document.querySelectorAll('.spot-card').forEach(card => {
                card.classList.remove('active');
            });

            // 如果原本没展开，现在就把它展开；如果原本就是展开的，则相当于点击收起
            if (!isActive) {
                selectedCard.classList.add('active');
            }
        }

        // 点击页面任何空白处（除了卡片本身），自动收回所有展开的卡片
        function handleBodyClick(event) {
            document.querySelectorAll('.spot-card').forEach(card => {
                card.classList.remove('active');
            });
        }
    </script>

</body>
</html>
